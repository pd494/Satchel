[package]
name = "satchel"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Cloudflare Workers runtime: fetch, Durable Objects (SQLite, alarms), Workers AI, R2.
worker = "0.8.6"
worker-macros = "0.8.6"
# Vectorize has no workers-rs binding, so it is reached through JS interop.
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
serde-wasm-bindgen = "0.6.5"
# Boundary parsing (Sendblue webhooks, Workers AI) and typed errors.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
