[package]
name = "satchel"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Cloudflare Workers runtime: fetch, Durable Objects (SQLite, alarms), Workers AI, R2.
worker = "0.8.6"
# Required by #[durable_object], which expands to wasm_bindgen code.
wasm-bindgen = "0.2.128"
# Webhook payloads and outbound message bodies.
serde_json = "1.0.151"
# Webhook signature verification.
base64 = "0.23.1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tiny_http = "0.12.0"
ureq = { version = "3.5.0", default-features = false }
