name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Biome and Oxlint
            command: bun run lint
          - name: Effect and TypeScript
            command: bun run check
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: ${{ matrix.command }}

  tests:
    name: Tests / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Spectrum integration
            command: bun run test:integration
            required_file: test/messages.test.ts
          - suite: Skills
            command: bun run test:skills
            required_file: test/skills.test.ts
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - if: hashFiles(matrix.required_file) != ''
        run: ${{ matrix.command }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - if: hashFiles('src/**/*.ts') != ''
        run: bun run test:coverage
      - if: hashFiles('src/**/*.ts') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - if: hashFiles('test/imessage.ts') != ''
        run: bun run build
      - if: hashFiles('test/imessage.ts') != ''
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: dist
          if-no-files-found: error
          retention-days: 14
