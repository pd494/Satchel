name: Eval

# Runs the E2E cases against the real model nightly and on every PR that changes the Worker or the
# eval, in three shards side by side. A scenario with a failed case runs once more, and a case that
# fails twice fails the run. Each shard writes its failures to its job summary. A failed nightly
# run comments them on the open "Nightly eval failures" issue, or opens it. A passing nightly run
# closes it. PRs from forks get no secrets and skip the run.
on:
  pull_request:
    paths:
      - "src/**"
      - "test/e2e/**"
      - "Cargo.*"
      - "wrangler.jsonc"
      - ".github/workflows/eval.yml"
  schedule:
    - cron: "0 19 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    name: End-to-end with the real model (${{ matrix.shard }}/3)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      EVAL_SHARD: ${{ matrix.shard }}/3
      EVAL_REPORT: eval-report-${{ matrix.shard }}.md
      EVAL_RUN: ${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm install --no-save wrangler@4
      - run: node test/e2e/live.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: if [ -f "$EVAL_REPORT" ]; then cat "$EVAL_REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
        if: ${{ always() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && github.event_name == 'schedule' }}
        with:
          name: eval-report-${{ matrix.shard }}
          path: ${{ env.EVAL_REPORT }}
          if-no-files-found: ignore

  nightly-issue:
    name: Nightly eval issue
    needs: eval
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: eval-report-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.eval.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --search "Nightly eval failures in:title" --json number --jq '.[0].number')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "All cases passed: $RUN_URL"; fi
            exit 0
          fi
          cat eval-report-*.md > report.md 2>/dev/null || true
          printf '\nRun: %s\n' "$RUN_URL" >> report.md
          if [ -z "$issue" ]; then
            gh issue create --title "Nightly eval failures" --body-file report.md
          else
            gh issue comment "$issue" --body-file report.md
          fi
