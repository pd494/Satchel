name: Setup project
description: Install the pinned Node, Bun, and project dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.4.2"
    - shell: bash
      run: bun install --frozen-lockfile
